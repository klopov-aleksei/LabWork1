name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        threads: [1, 2, 4]
        sample: [sample2-2.bmp, sample2-3.bmp]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libomp-dev
        
    - name: Build project
      run: make
      
    - name: Run tests with ${{ matrix.threads }} threads on ${{ matrix.sample }}
      run: |
        OMP_NUM_THREADS=${{ matrix.threads }} ./start "BMP samples/${{ matrix.sample }}" > performance.log 2>&1
        
    - name: Verify outputs
      run: |
        [ -f rotated_90_clockwise.bmp ] || exit 1
        [ -f rotated_90_counterclockwise.bmp ] || exit 1
        [ -f gaussian_filtered.bmp ] || exit 1
        rm rotated_*.bmp gaussian_filtered.bmp
      
    - name: Show performance
      run: |
        echo "Performance for ${{ matrix.sample }} with ${{ matrix.threads }} threads:"
        cat performance.log
        rm performance.log